<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalaryBuddy — Decode Your Payslip</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <!-- Design tokens must be loaded first so subsequent sheets can use the variables -->
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/bubbles.css">
  <link rel="stylesheet" href="/static/css/qr.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
<div id="shell">

  <!-- ── Chat panel ──────────────────────────────────────────────────── -->
  <div id="chat-panel">

    <nav id="chat-nav">
      <div class="brand-mark">💼</div>
      <div class="brand-copy">
        <strong>SalaryBuddy</strong>
        <small>Payslip decoder</small>
      </div>
      <button id="wa-toggle" aria-label="Connect on WhatsApp" title="Connect on WhatsApp" style="display:none">📱</button>
    </nav>

    <div id="messages"></div>
    <div id="upload-hint"></div>

    <div id="input-bar">
      <button class="ibtn" id="upload-btn" title="Upload payslip (JPEG · PNG · PDF)" disabled>📎</button>
      <input type="file" id="file-input" accept="image/jpeg,image/png,application/pdf">
      <textarea id="msg-input" placeholder="Ask me about your payslip…" rows="1"></textarea>
      <button class="ibtn" id="send-btn" title="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- ── Desktop QR sidebar (>1024 px) ───────────────────────────────── -->
  <div id="qr-panel" style="display:none">
    <div class="qr-inner"></div>
  </div>

  <!-- ── Mobile / tablet QR overlay (≤1024 px) ───────────────────────── -->
  <div id="qr-overlay" role="dialog" aria-modal="true" aria-label="Connect on WhatsApp" style="display:none">
    <div class="qr-sheet">
      <div class="qr-sheet-handle"></div>
      <button class="qr-sheet-close" id="qr-close" aria-label="Close">✕</button>
      <div class="qr-inner"></div>
    </div>
  </div>

</div><!-- /#shell -->

<!-- ES module entry point — imports all classes and boots the app -->
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
